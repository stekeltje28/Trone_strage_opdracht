<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Pets — Pet Sitting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/css/style.css" rel="stylesheet" />
  <style>
    :root{ --bd:#e5e7eb; --muted:#64748b; --ink:#0f172a; --ink-weak:#334155; --bg-soft:#f8fafc; --accent:#0f172a; }
    .skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
    .skip-link:focus{position:static;width:auto;height:auto;padding:.5rem .75rem;background:#fff;border:1px solid var(--bd);border-radius:.5rem}
    .input{border:1px solid var(--bd);border-radius:.5rem;padding:.45rem .7rem;font-size:.9rem;min-width:240px}
    .btn{appearance:none;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:.5rem;padding:.45rem .75rem;font-size:.9rem;cursor:pointer}
    .btn:hover{background:#f1f5f9}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.icon{display:inline-flex;align-items:center;gap:.4rem}
    .chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:.25rem .6rem;font-size:.8rem;color:var(--ink-weak);cursor:pointer}
    .chip[aria-pressed="true"]{background:var(--bg-soft);color:var(--ink);border-color:var(--ink-weak)}
    .badge{display:inline-block;font-size:.75rem;background:var(--bg-soft);border:1px solid var(--bd);color:var(--ink-weak);border-radius:999px;padding:.15rem .5rem}
    .skeleton{border-radius:.5rem;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);background-size:400% 100%;animation:shimmer 1.2s ease-in-out infinite;height:44px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:1rem}
    .modal{background:#fff;border:1px solid var(--bd);border-radius:.75rem;max-width:560px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    .modal header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-bottom:1px solid var(--bd)}
    .modal header h3{margin:0;font-size:1.05rem}
    .modal .body{padding:1rem}
    .modal .foot{padding:0 1rem 1rem 1rem;display:flex;justify-content:flex-end}
    .modal-backdrop.show{display:flex}
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <a href="#main" class="skip-link">Direct naar inhoud</a>

  <script>
    // Vroege auth-guard
    (function () {
      try {
        var token = localStorage.getItem('ps_access_token');
        if (!token || token === 'null' || token === 'undefined' || token.trim() === '') {
          var here = (location.pathname || '') + (location.search || '') + (location.hash || '');
          location.replace('/pages/login.html?next=' + encodeURIComponent(here));
        }
      } catch (e) {
        location.replace('/pages/login.html');
      }
    })();
  </script>

  <header class="sticky top-0 z-40 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="h-16 flex items-center justify-between">
        <nav class="flex items-center gap-6">
          <a href="/pages/home.html" class="text-sm text-slate-600 hover:text-slate-900">Home</a>
          <a href="/pages/pets.html" class="text-sm font-semibold text-blue-600">Pets</a>
          <a href="/pages/appointments.html" class="text-sm text-slate-600 hover:text-slate-900">Afspraken</a>
        </nav>
        <div class="flex items-center gap-4">
          <span class="text-sm text-slate-600">Ingelogd als <strong data-user class="text-slate-900"></strong></span>
          <a href="/pages/login.html" data-logout class="text-sm text-slate-600 hover:text-slate-900">Uitloggen</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="max-w-7xl mx-auto px-4 sm:px-6 py-8" role="main">
    <header class="mb-4">
      <h1 class="text-2xl sm:text-3xl font-bold">Huisdieren</h1>
      <p class="text-xs bg-slate-50 border border-slate-200 text-slate-700 rounded-full inline-block px-2 py-0.5 mt-2" id="last-updated">—</p>
      <div id="page-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </header>

    <section class="rounded-lg bg-white border border-slate-200 p-4" aria-label="Huisdierenlijst">
      <div class="flex items-center justify-between gap-3 mb-3 flex-wrap" aria-label="Acties en filters">
        <div class="flex items-center gap-3 flex-wrap">
          <div class="flex items-center gap-2">
            <label for="q" class="sr-only">Zoeken</label>
            <input id="q" class="input" placeholder="Zoek op naam of ras…" />
          </div>
          <div class="flex items-center gap-2" role="group" aria-label="Grootte filter">
            <button class="chip" data-size="all" aria-pressed="true">Alles</button>
            <button class="chip" data-size="small" aria-pressed="false">Small</button>
            <button class="chip" data-size="medium" aria-pressed="false">Medium</button>
            <button class="chip" data-size="large" aria-pressed="false">Large</button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" class="btn icon" id="btn-refresh" title="Vernieuwen">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.9 6h-2.06A6 6 0 1 1 12 6c1.3 0 2.5.42 3.47 1.13L13 10h7V3l-2.35 2.35z"/></svg>
            Vernieuwen
          </button>
          <button type="button" class="btn icon" id="btn-export" title="Exporteer CSV">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5m14-9h-4V3H9v6H5l7 7 7-7z"/></svg>
            Export
          </button>
          <button type="button" class="btn icon" id="btn-print" title="Afdrukken">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 8h-1V3H6v5H5c-1.66 0-3 1.34-3 3v5h4v4h12v-4h4v-5c0-1.66-1.34-3-3-3M8 5h8v3H8zm8 14H8v-5h8zm4-4h-2v-3H6v3H4v-3c0-.55.45-1 1-1h14c.55 0 1 .45 1 1z"/></svg>
            Printen
          </button>
          <button type="button" class="btn primary icon" id="btn-new">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
            Nieuw huisdier
          </button>
        </div>
      </div>

      <div id="list" class="divide-y divide-slate-200">
        <div class="skeleton h-11" aria-hidden="true"></div>
      </div>

      <div class="flex items-center justify-between pt-3">
        <button class="btn" id="prev" disabled>Vorige</button>
        <span id="pageinfo" class="text-sm text-slate-600">—</span>
        <button class="btn" id="next" disabled>Volgende</button>
      </div>
    </section>
  </main>

  <!-- Modal voor Nieuw huisdier -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <h3 id="modal-title">Nieuw huisdier</h3>
        <button class="btn" id="modal-close" aria-label="Sluiten">✕</button>
      </header>
      <div class="body" id="modal-body"></div>
      <div class="foot">
        <button class="btn" id="modal-cancel">Annuleren</button>
      </div>
    </div>
  </div>

  <script type="module">
    // -------- helpers: auth / base ----------
    const API_BASE_URL = window.API_BASE_URL || 'http://localhost:8000/api/v1';
    const headers = () => {
      const t = localStorage.getItem('ps_access_token');
      const h = new Headers({ 'Accept': 'application/json' });
      if (t && t !== 'null' && t !== 'undefined') h.set('Authorization', `Bearer ${t.replace(/^"|"$/g, '')}`);
      return h;
    };
    async function fetchJSON(url, init={}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const res = await fetch(url, { ...init, headers: headers(), signal: controller.signal });
        const txt = await res.text();
        const data = txt ? (()=>{try{return JSON.parse(txt);}catch{return txt;}})() : null;
        if (!res.ok) {
          const msg = (data && data.message) || (Array.isArray(data?.detail) && data.detail[0]?.msg) || (typeof data === 'string' ? data : `Request faalde (${res.status})`);
          throw new Error(msg);
        }
        return data;
      } finally { clearTimeout(timer); }
    }
    const api = {
      listPets: async ({ q='', limit=10, offset=0 }={}) => {
        const sp = new URLSearchParams({ limit:String(limit), offset:String(offset) });
        if (q) sp.set('q', q);
        return fetchJSON(`${API_BASE_URL}/pets?${sp.toString()}`);
      },
      createPet: async (payload) => fetchJSON(`${API_BASE_URL}/pets`, { method:'POST', headers: new Headers({ ...Object.fromEntries(headers()), 'Content-Type':'application/json' }), body: JSON.stringify(payload) }),
    };

    // -------- state ----------
    const state = { q:'', size:'all', limit:10, offset:0, items:[], total:null, loading:false };

    // -------- dom refs ----------
    const listEl = document.querySelector('#list');
    const prevEl = document.querySelector('#prev');
    const nextEl = document.querySelector('#next');
    const pageInfoEl = document.querySelector('#pageinfo');
    const statusEl = document.querySelector('#page-status');
    const lastUpdatedEl = document.querySelector('#last-updated');
    const qEl = document.querySelector('#q');
    const chips = [...document.querySelectorAll('.chip[data-size]')];
    const btnRefresh = document.querySelector('#btn-refresh');
    const btnExport = document.querySelector('#btn-export');
    const btnPrint = document.querySelector('#btn-print');
    const btnNew = document.querySelector('#btn-new');
    const modal = document.querySelector('#modal');
    const modalBody = document.querySelector('#modal-body');

    const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg || ''; };
    const setLastUpdated = () => {
      const d = new Date(); const hh = String(d.getHours()).padStart(2,'0'); const mm = String(d.getMinutes()).padStart(2,'0');
      if (lastUpdatedEl) lastUpdatedEl.textContent = `Vernieuwd ${hh}:${mm}`;
    };

    // -------- renderers ----------
    function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function normalizeList(res){
      const items = Array.isArray(res) ? res
                  : Array.isArray(res?.items) ? res.items
                  : Array.isArray(res?.data) ? res.data
                  : Array.isArray(res?.results) ? res.results
                  : [];
      const total = typeof res?.total === 'number' ? res.total
                  : typeof res?.count === 'number' ? res.count
                  : items.length;
      return { items, total };
    }

    function renderList(){
      listEl.innerHTML = '';
      if (!state.items.length) {
        listEl.innerHTML = '<p class="text-sm text-slate-600 py-2">Geen huisdieren gevonden.</p>';
        return;
      }
      for (const p of state.items) {
        const row = document.createElement('div');
        row.className = "py-3 flex items-center justify-between";
        const metaDate = p.created_at || p.createdAt || '';
        row.innerHTML = `
          <div>
            <div class="font-medium">${escapeHtml(p.name)} <span class="text-slate-400">•</span> ${escapeHtml(p.breed)} <span class="text-slate-400">•</span> ${escapeHtml(p.size)} <span class="text-slate-400">•</span> geb. ${escapeHtml(p.birthdate || '')}</div>
            <div class="text-xs text-slate-500">#${escapeHtml(p.id)} ${metaDate ? 'aangemaakt ' + escapeHtml(String(metaDate).slice(0,10)) : ''}</div>
          </div>
        `;
        listEl.appendChild(row);
      }
    }

    function renderPager(lenOnPage){
      prevEl.disabled = state.offset === 0 || state.loading;
      nextEl.disabled = state.loading || lenOnPage < state.limit;
      pageInfoEl.textContent = `Offset ${state.offset} • ${lenOnPage} items op deze pagina`;
    }

    // -------- loading ----------
    function setLoading(v){
      state.loading = !!v;
      qEl.disabled = v;
      chips.forEach(c => c.disabled = v);
      btnRefresh.disabled = v;
      btnExport.disabled = v;
      btnPrint.disabled = v;
      btnNew.disabled = v;
      prevEl.disabled = v || state.offset === 0;
      nextEl.disabled = v;
      if (v) { listEl.innerHTML = '<div class="skeleton h-11" aria-hidden="true"></div>'; }
    }

    // -------- load ----------
    async function load(){
      setLoading(true);
      try {
        const res = await api.listPets({ q: state.q, limit: state.limit, offset: state.offset });
        const { items } = normalizeList(res);
        // client-side size filter (server kan later meedoen)
        const filtered = state.size === 'all' ? items : items.filter(p => p.size === state.size);
        state.items = filtered;
        renderList();
        renderPager(items.length); // pager baseert zich op ongefilterde page-len
        setLastUpdated();
        setStatus((state.q || state.size !== 'all')
          ? `Filter actief. ${filtered.length} van ${items.length} getoond.`
          : `Alle ${items.length} items getoond.`);
      } catch (err) {
        state.items = [];
        renderList();
        renderPager(0);
        setStatus(err?.message || 'Laden mislukt');
      } finally {
        setLoading(false);
      }
    }

    // -------- events: search / chips / pager / actions ----------
    let qTimer = null;
    qEl.addEventListener('input', () => {
      const v = qEl.value.trim();
      if (v === state.q) return;
      state.q = v;
      state.offset = 0;
      clearTimeout(qTimer);
      qTimer = setTimeout(load, 300);
    });

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => c.setAttribute('aria-pressed','false'));
        chip.setAttribute('aria-pressed','true');
        state.size = chip.dataset.size;
        state.offset = 0;
        load();
      });
    });

    prevEl.addEventListener('click', () => {
      if (state.loading) return;
      state.offset = Math.max(0, state.offset - state.limit);
      load();
    });
    nextEl.addEventListener('click', () => {
      if (state.loading) return;
      state.offset += state.limit;
      load();
    });

    document.querySelector('#btn-refresh').addEventListener('click', () => {
      state.offset = 0;
      load();
    });

    document.querySelector('#btn-print').addEventListener('click', () => window.print());

    document.querySelector('#btn-export').addEventListener('click', async () => {
      try {
        // Export: haal (voor eenvoud) alle pagina's op totdat minder dan limit is
        const all = [];
        let offset = 0, page = [];
        do {
          const res = await api.listPets({ q: state.q, limit: 200, offset });
          const { items } = normalizeList(res);
          page = items;
          const filtered = state.size === 'all' ? items : items.filter(p => p.size === state.size);
          all.push(...filtered);
          offset += 200;
        } while (page.length === 200 && offset < 10000);

        const rows = [
          ['id','name','breed','size','birthdate'],
          ...all.map(p => [p.id, p.name, p.breed, p.size, p.birthdate])
        ];
        const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'pets.csv'; a.click();
        URL.revokeObjectURL(url);
        setStatus(`Export van ${all.length} items gestart.`);
      } catch (err) {
        setStatus(err?.message || 'Export mislukt.');
      }
    });

    // -------- modal / form ----------
    function closeModal(){
      modal.classList.remove('show');
      modalBody.innerHTML = '';
      document.body.style.overflow = '';
    }
    document.querySelector('#modal-close').addEventListener('click', closeModal);
    document.querySelector('#modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

    function buildFallbackForm(){
      const todayStr = new Date().toISOString().slice(0,10);
      const wrap = document.createElement('form');
      wrap.className = 'space-y-3';
      wrap.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Naam</span>
            <input name="name" required class="input" placeholder="Bijv. Luna" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Ras</span>
            <input name="breed" required class="input" placeholder="Bijv. Labrador" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Grootte</span>
            <select name="size" required class="input">
              <option value="">Kies…</option>
              <option value="small">small</option>
              <option value="medium">medium</option>
              <option value="large">large</option>
            </select>
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Geboortedatum</span>
            <input type="date" name="birthdate" required max="${todayStr}" class="input" />
          </label>
        </div>
        <div class="flex justify-end">
          <button class="btn primary" type="submit">Toevoegen</button>
        </div>
      `;
      wrap.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(wrap);
        const payload = {
          name: String(fd.get('name')||'').trim(),
          breed: String(fd.get('breed')||'').trim(),
          size: String(fd.get('size')||'').trim(),
          birthdate: String(fd.get('birthdate')||'').trim(),
        };
        try {
          await api.createPet(payload);
          closeModal();
          setStatus('Huisdier opgeslagen.');
          state.offset = 0;
          await load();
        } catch (err) {
          setStatus(err?.message || 'Opslaan mislukt.');
        }
      });
      return wrap;
    }

    document.querySelector('#btn-new').addEventListener('click', async () => {
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';

      // Probeer dynamisch PetForm te importeren, val terug op fallback
      let content = null;
      try {
        const mod = await import('/static/js/components/PetForm.js');
        if (mod?.PetForm) {
          content = mod.PetForm({
            onSaved: async () => {
              setStatus('Huisdier opgeslagen.');
              closeModal();
              state.offset = 0;
              await load();
            }
          });
        }
      } catch {}

      if (!content) content = buildFallbackForm();
      modalBody.innerHTML = '';
      modalBody.append(content);
      setTimeout(() => modal.querySelector('input[name="name"]')?.focus(), 0);
    });

    // -------- user / logout minimal ----------
    (async () => {
      const userEl = document.querySelector('[data-user]');
      try {
        const cached = localStorage.getItem('ps_user');
        const u = cached ? JSON.parse(cached) : null;
        userEl.textContent = u?.name || u?.full_name || u?.username || u?.email || 'Gebruiker';
      } catch { userEl.textContent = 'Gebruiker'; }
    })();
    document.addEventListener('click', async (e) => {
      const link = e.target.closest?.('[data-logout]');
      if (!link) return;
      e.preventDefault();
      try {
        localStorage.removeItem('ps_access_token');
        localStorage.removeItem('ps_refresh_token');
        localStorage.removeItem('ps_user');
      } finally {
        window.location.replace('/pages/login.html');
      }
    }, { capture:true });

    // -------- init ----------
    setLastUpdated();
    load();

    // globale errors → status
    window.addEventListener('unhandledrejection', (e) => setStatus(e?.reason?.message || 'Er is een fout opgetreden.'));
    window.addEventListener('error', (e) => setStatus(e?.error?.message || e?.message || 'Er is een fout opgetreden.'));
  </script>
</body>
</html>
