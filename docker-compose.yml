services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stage_api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app.db:/app/app.db
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: stage_web
    depends_on:
      - api
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
